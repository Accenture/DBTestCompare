# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java

on:
  workflow_dispatch:
  push:
    branches:
      - "*"
    paths-ignore:
      - README.md
      - gh-pages
    tags:
      - "*"
  schedule:
    - cron: "0 19 * * 0"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    env:
      DBTESTCOMPAREVERSION: 2.0.0
    steps:
      - uses: actions/checkout@v4
      - name: Restore existing GitHub Pages site
        shell: bash
        run: |
          mkdir -p site
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --no-tags origin gh-pages
            git archive FETCH_HEAD | tar -x -C site
          else
            echo "No gh-pages branch exists yet; starting a new site."
          fi
      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant
      - name: Set tag version
        shell: bash
        run: echo "DBTESTCOMPAREVERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
        if: startsWith(github.ref, 'refs/tags/')
      - shell: pwsh
        run: |
          ./setDBTestCompareVersion.ps1
      - shell: pwsh
        run: |
          ./downloadBackupAndJDBCDrivers.ps1
      - name: Start databases (retry on public.ecr.aws rate limiting)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            docker compose -f "./docker/docker-compose.yml" up -d --build && exit 0
            echo "compose up attempt $i failed (likely toomanyrequests); retrying in 30s..."
            sleep 30
          done
          echo "compose up failed after 5 attempts" >&2
          exit 1
      - shell: pwsh
        run: |
          ./restoreBackup.ps1
      - name: Run ant build
        run: ant -noinput -buildfile ./deploy/build.xml -Dconfig=DEV02 compile tokens.copy.files testdbq.run
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action/linux@v2
        if: success() || failure()
        with:
          files: "**/TEST-*.xml"
          report_individual_runs: true
      - name: Update test statistics
        uses: raczeja/test-stats-gh-pages-action@v1.1.3
        if: success() || failure()
        with:
          result-files: "**/TEST-*.xml"
          format: auto
          site-directory: site
          stats-subdirectory: stats
          history-days: 30
          report-name: DBTestCompare tests
          dashboard-url: https://accenture.github.io/DBTestCompare/stats/
          detailed-statistics: "true"
          shell-test-results: "**/TEST-*.xml"
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: pages-site
          path: site
      - shell: pwsh
        run: |
          ./copyArtifact.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DBTestCompare${{ env.DBTESTCOMPAREVERSION }}.TestResults.${{github.run_number}}
          path: ./target/test-output
      - uses: actions/upload-artifact@v4
        with:
          name: DBTestCompare${{ env.DBTESTCOMPAREVERSION }}.TestDefinitionsResults.${{github.run_number}}
          path: ./target/test-definitions
      - uses: actions/upload-artifact@v4
        with:
          name: DBTestCompare${{ env.DBTESTCOMPAREVERSION }}
          path: ./release
      - shell: pwsh
        run: compress-archive -path "./release" ./release/DBTestCompare${{ env.DBTESTCOMPAREVERSION }}.zip
      - shell: pwsh
        run: Copy './release/DBTestCompare${{ env.DBTESTCOMPAREVERSION }}.zip' '${{ github.workspace }}'
      - name: "Upload linux artifact to Release"
        run: gh release upload "${{ env.DBTESTCOMPAREVERSION }}" "./release/DBTestCompare${{ env.DBTESTCOMPAREVERSION }}.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: startsWith(github.ref, 'refs/tags/')

  publish:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pages-site
          path: site
      - name: Publish test statistics to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          force_orphan: true
